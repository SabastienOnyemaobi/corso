# See: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    rebase-strategy: "disabled"
    groups:
      actions:
        patterns: ["*"]

  # Maintain dependencies for npm - website
  - package-ecosystem: "npm"
    directory: "website/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    rebase-strategy: "disabled"
    groups:
      # one PR for everything that should be backwards compatible
      website-minor:
        update-types: ["minor", "patch"]
    ignore:
      # major upgrades need a manual migration of the site's styles
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
      - dependency-name: "tw-elements"
        update-types: ["version-update:semver-major"]

  # Maintain dependencies for go - src
  - package-ecosystem: "gomod"
    directory: "src/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    rebase-strategy: "disabled"
    groups:
      # one PR for everything that should be backwards compatible
      go-minor:
        update-types: ["minor", "patch"]
    ignore:
      # pinned on purpose, see the note in src/go.mod
      - dependency-name: "github.com/vbauerster/mpb/v8"
      # the module was renamed upstream; Dependabot errors on the old path
      - dependency-name: "github.com/armon/go-metrics"

  # Maintain base images
  - package-ecosystem: "docker"
    directories:
      - "/build"
      - "/docker"
      - "/website"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    rebase-strategy: "disabled"
    ignore:
      # the Go image follows the version in src/go.mod; only take patches
      - dependency-name: "golang"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

# See: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    reviewers:
      - "alcionai/corso-maintainers"
    open-pull-requests-limit: 50
    rebase-strategy: "disabled"

  # Maintain dependencies for npm - website
  - package-ecosystem: "npm"
    directory: "website/"
    schedule:
      interval: "daily"
    reviewers:
      - "alcionai/corso-maintainers"
      - "ntolia"
      - "gmatev"
    open-pull-requests-limit: 50
    rebase-strategy: "disabled"

  # Maintain dependencies for go - src
  - package-ecosystem: "gomod"
    directory: "src/"
    ignore:
      # pinned on purpose, see the note in src/go.mod
      - dependency-name: "github.com/vbauerster/mpb/v8"
    schedule:
      interval: "daily"
    reviewers:
      - "alcionai/corso-maintainers"
    open-pull-requests-limit: 50
    rebase-strategy: "disabled"

  # Maintain base images
  - package-ecosystem: "docker"
    directories:
      - "/build"
      - "/docker"
      - "/website"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    rebase-strategy: "disabled"
